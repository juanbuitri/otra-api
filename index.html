    <script>
       let pokemones = [];
let totalPokes = 1026; /* debe agregarse uno mas ya q el indice comienza en 0 */

async function  conexionLista() {
    const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025')
    const data = await res.json()
    pokemones = data;
   // mostrarLista(pokemones)
    console.log(pokemones)

    for (var i = 0; i < totalPokes; i++) {
        console.log(pokemones.results[i].name)
        document.getElementById("app").innerHTML += "<p>" + pokemones.results[i].name + "</p>"
}
}

// filtro async pantallazo celular

conexionLista()
    </script>
